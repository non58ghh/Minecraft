<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>The Settlement Chronicle</title>
<style>
:root {
	--paper: #f3eee3; --sheet: #fbf8f1; --ink: #201c17; --faded: #776e60; --rule: #d8cfbd; --rule-strong: #b9ad97;
	--accent: #8b2e1a; --good: #4c6a35; --bad: #a33a22;
	--heart: #d8262b; --heart-empty: rgba(0,0,0,.18); --ground: #e7e4d2; --ground-night: #1d2433;
	--serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
	--sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--paper: #15120e; --sheet: #1c1813; --ink: #ebe3d2; --faded: #a0957f; --rule: #362f26; --rule-strong: #514636;
		--accent: #e08a68; --good: #9cc07a; --bad: #ec8a6f;
		--heart: #ff4a4f; --heart-empty: rgba(255,255,255,.18); --ground: #26241d; --ground-night: #121726;
		color-scheme: dark;
	}
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 var(--serif); }
a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

/* Masthead: a sky that follows the game clock */
.mast { border-bottom: 3px double var(--rule-strong); }
.band { position: relative; padding: 20px 0 30px; }
.sky { position: absolute; inset: 0 -16px; z-index: 0; overflow: hidden; border-radius: 0 0 8px 8px; }
.sky svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sky .orb { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; }
.sky .orb.sun { background: #fff3c4; box-shadow: 0 0 0 6px rgba(255,233,168,.35), 0 0 28px 10px rgba(255,220,140,.45); }
.sky .orb.moon { background: #e9ecf5; box-shadow: 0 0 18px 4px rgba(220,228,255,.25);
	background-image: radial-gradient(circle at 64% 38%, #c9cede 0 3px, transparent 3.5px), radial-gradient(circle at 34% 66%, #c9cede 0 2px, transparent 2.5px); }
.sky .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; }
.band .title { position: relative; z-index: 1; padding: 0 2px; text-shadow: 0 1px 0 rgba(255,255,255,.35); }
.mast.dark .title { color: #f1ecdf; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.mast.dark .date { color: #c9cfe2; }
.live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3fbf5a; margin-right: 6px;
	vertical-align: 1px; box-shadow: 0 0 0 0 rgba(63,191,90,.6); animation: pulse 2.4s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(63,191,90,.55); } 70% { box-shadow: 0 0 0 7px rgba(63,191,90,0); } 100% { box-shadow: 0 0 0 0 rgba(63,191,90,0); } }
.twinkle { animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .15; } }
.mast .title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.mast h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.mast h1 a { text-decoration: none; }
.mast .date { font: 13px/1.3 var(--sans); color: var(--faded); text-align: right; white-space: nowrap; }
nav { display: flex; gap: 22px; margin-top: 10px; font: 600 14px/1 var(--sans); }
nav a { text-decoration: none; color: var(--faded); padding: 8px 0 10px; border-bottom: 2px solid transparent; }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 18px 0 64px; }

/* Type */
h2 { font-size: 15px; font-weight: 600; font-style: italic; color: var(--faded); margin: 34px 0 10px;
	padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
h2:first-child { margin-top: 0; }
.headline { font-size: 27px; line-height: 1.18; font-weight: 700; margin: 6px 0 10px; letter-spacing: -.01em; }
.kicker { font: 600 12px/1.3 var(--sans); color: var(--accent); letter-spacing: .02em; }
.small { font: 13px/1.45 var(--sans); color: var(--faded); }
.quiet { color: var(--faded); }
.bad { color: var(--bad); }
.good { color: var(--good); }
p { margin: 0 0 10px; }
.empty { color: var(--faded); font-style: italic; }
.notice { font: 14px/1.45 var(--sans); border-left: 3px solid var(--accent); padding: 8px 12px; margin: 0 0 16px; background: var(--sheet); }
.more { font: 600 14px/1 var(--sans); color: var(--accent); text-decoration: none; display: inline-block; margin-top: 4px; }
button.more { background: none; border: 0; padding: 8px 0; cursor: pointer; }

/* Dialogue */
.dialogue { margin: 10px 0 6px; padding-left: 14px; border-left: 2px solid var(--rule-strong); }
.dialogue p { margin: 0 0 7px; }
.dialogue .who { font-variant: small-caps; letter-spacing: .03em; font-weight: 600; margin-right: 6px; }

/* Portraits */
.face { display: inline-block; vertical-align: middle; image-rendering: pixelated; border-radius: 2px; flex: none;
	box-shadow: 0 0 0 1px var(--rule-strong); }
.face.dead { filter: grayscale(1); opacity: .6; }

/* Rows of people */
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.people li:last-child { border-bottom: 0; }
.people .name { font-weight: 700; }
.people .doing { font-size: 15px; }
.people a.row { display: flex; gap: 12px; align-items: center; text-decoration: none; flex: 1; min-width: 0; }

/* Chronicle */
.day { font: 700 13px/1 var(--sans); color: var(--accent); margin: 26px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.day:first-child { margin-top: 0; }
.entry { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 7px 0; }
.entry .t { font: 12px/1.9 var(--mono); color: var(--faded); }
.entry .x { min-width: 0; }
.entry.routine { font-size: 15px; color: var(--faded); padding: 3px 0; }
.entry.big .x { font-weight: 700; }
.entry a { text-decoration: none; }
.entry a:hover { text-decoration: underline; }
.times { font: 12px var(--sans); color: var(--faded); margin-left: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font: 600 14px/1 var(--sans); margin-bottom: 18px; }
.filters a { text-decoration: none; color: var(--faded); padding: 6px 0; }
.filters a.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
select { font: 600 13px var(--sans); color: var(--faded); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px;
	padding: 6px 8px; margin-left: auto; }

/* Person */
.who-head { display: flex; gap: 16px; align-items: center; margin-bottom: 4px; }
.who-head h1 { font-size: 32px; line-height: 1.1; margin: 0; }
.now { font-size: 19px; line-height: 1.45; margin: 14px 0 4px; }
.steps { margin: 6px 0 0; padding-left: 24px; }
.steps li { padding: 3px 0; }
.steps li.next { font-weight: 700; }
.steps li.next::marker { color: var(--accent); }
.condition { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 10px; }
.condition div { font: 13px/1.3 var(--sans); }
.condition b { display: block; font: 600 15px/1.3 var(--serif); }
.meter { height: 6px; background: var(--rule); margin-top: 6px; border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 3px; }
.meter.low i { background: var(--bad); }
.goods { margin: 2px 0 0; font-size: 16px; line-height: 1.6; }
.goods .tool { font-weight: 700; }
.goods .sep { color: var(--faded); }
.plan-box { border-left: 3px solid var(--accent); background: var(--sheet); padding: 10px 14px; margin: 14px 0; }
.plan-box .kicker { margin-bottom: 2px; }
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.ledger li:last-child { border-bottom: 0; }
.plan-floor { margin: 8px 0 0; }
.plan-floor .grid { display: inline-grid; gap: 1px; background: var(--rule-strong); border: 1px solid var(--rule-strong); }
.plan-floor .grid span { width: 17px; height: 17px; background: var(--sheet); }
.plan-floor .grid span.w { background: var(--ink); }
.plan-floor .grid span.d { background: var(--accent); }
.plan-floor .grid span.o { background: transparent; }
.plan-floor .cap { display: block; margin-top: 4px; }
details { margin-top: 10px; }
summary { cursor: pointer; font: 600 14px/1.4 var(--sans); color: var(--accent); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; }
details[open] summary::before { content: "▾ "; }
table.scores { width: 100%; border-collapse: collapse; font: 13px/1.4 var(--sans); margin-top: 8px; }
table.scores td { padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.scores td.v { text-align: right; font-family: var(--mono); white-space: nowrap; }
table.scores tr.chosen td:first-child { font-weight: 700; color: var(--accent); }
.because { margin: 6px 0 0; padding-left: 20px; }
.because li { padding: 2px 0; }
.token { display: flex; gap: 8px; margin-top: 10px; }
.token input { flex: 1; min-width: 0; font: 15px var(--sans); padding: 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); color: var(--ink); }
.token button { font: 600 14px var(--sans); padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: var(--paper); cursor: pointer; }
.hl { background: var(--sheet); outline: 1px solid var(--accent); outline-offset: 2px; }
@media (max-width: 480px) {
	.mast h1 { font-size: 22px; }
	.headline { font-size: 23px; }
	.condition { grid-template-columns: repeat(2, 1fr); }
}
/* Hearts */
.hearts { display: inline-flex; gap: 1px; vertical-align: -1px; white-space: nowrap; }
.hearts .heart { image-rendering: pixelated; }
.hearts.low { animation: beat 1.1s ease-in-out infinite; }
@keyframes beat { 50% { transform: scale(1.08); } }
.who-head .hearts { margin: 6px 0 2px; }
.doing.fighting { color: var(--bad); font-weight: 700; }

/* Map */
.map { margin: 6px 0 22px; }
.map > svg { width: 100%; height: auto; display: block; border-radius: 6px; border: 1px solid var(--rule-strong); }
.map .ground { fill: var(--ground); }
.map.night .ground { fill: var(--ground-night); }
.map .grid { stroke: var(--rule); stroke-width: 1; }
.map.night .grid { stroke: rgba(255,255,255,.06); }
.map .home path { fill: var(--accent); }
.map .home rect { fill: var(--sheet); stroke: var(--accent); stroke-width: 1.2; }
.map .who .ring { fill: none; stroke: transparent; stroke-width: 2; }
.map .who:hover .ring { stroke: var(--accent); }
.map .who.chased .ring { stroke: var(--bad); animation: alarm 1s ease-in-out infinite; }
.map .who.fighting .ring { stroke: var(--bad); stroke-dasharray: 4 3; }
@keyframes alarm { 50% { stroke-opacity: .2; } }
.map .label { pointer-events: none; font: 600 11px var(--sans); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--ground); stroke-width: 3px; }
.map.night .label { fill: #e8e6f0; stroke: var(--ground-night); }
.map .mob rect { stroke: rgba(0,0,0,.45); stroke-width: 1; }
.map .mob.hunting rect { animation: alarm 1s ease-in-out infinite; }
.map .chase { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 3 3; }
.map .scale line { stroke: var(--faded); stroke-width: 2; }
.map .scale text { font: 10px var(--sans); fill: var(--faded); }
.map.night .scale text { fill: #9aa3bf; }
.map figcaption { margin-top: 4px; }

/* The map drawn from the world itself, framed like a map item */
.map.land { margin: 12px 6px 24px; }
.map.land > svg { border: 0; border-radius: 1px; box-shadow: 0 0 0 4px #e3d3a6, 0 0 0 7px #7a5a32, 0 3px 10px 7px rgba(0,0,0,.18); }
.map.land .ground { fill: #d9c89b; }
.map .land { image-rendering: pixelated; image-rendering: crisp-edges; }
.map .dusk { fill: #0a1236; opacity: .45; }
.map.land .label { fill: #fff; stroke: rgba(0,0,0,.75); stroke-width: 3px; }
.map.land .home path { fill: #b33a1f; stroke: #fff; stroke-width: 1; }
.map.land .home rect { fill: #f3e6c4; stroke: #fff; }
.map .head { filter: drop-shadow(0 0 1px rgba(0,0,0,.8)); }
.map.land .face, .map.land .who svg { filter: drop-shadow(0 0 1.5px rgba(0,0,0,.9)); }
.map.land .scale line { stroke: #fff; }
.map.land .scale text { fill: #fff; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 2px; }

/* A new event arriving */
.entry.fresh { animation: arrive 2.4s ease-out; border-radius: 4px; }
@keyframes arrive { 0% { background: color-mix(in srgb, var(--accent) 22%, transparent); transform: translateY(-4px); opacity: .4; }
	25% { transform: none; opacity: 1; } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .live, .twinkle, .hearts.low, .entry.fresh, .map .who.chased .ring, .map .mob.hunting rect { animation: none; } }

/* Stories */
.views { display: flex; gap: 16px; font: 600 14px/1 var(--sans); margin-bottom: 18px; }
.views a { text-decoration: none; color: var(--faded); padding: 6px 0; }
.views a.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
.story { padding: 16px 0 14px; border-top: 1px solid var(--rule); }
.day + .story { border-top: 0; padding-top: 6px; }
.story h3 { font-size: 21px; line-height: 1.22; font-weight: 700; margin: 4px 0 8px; letter-spacing: -.005em; text-wrap: balance; }
.story h3.plain { font-size: 18px; }
.story .who-when { font: 13px/1.4 var(--sans); color: var(--faded); }
.story .who-when a { color: var(--faded); }
.story p.tale { font-size: 17px; line-height: 1.55; margin: 0 0 8px; max-width: 64ch; }
.story .stands { font: 14px/1.4 var(--sans); margin: 6px 0; }
.story .stands b { font: 600 11px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faded); margin-right: 6px; }
.story details { margin-top: 6px; }
.story summary { font: 600 13px/1.6 var(--sans); color: var(--accent); cursor: pointer; width: fit-content; }
.story details .entry { padding: 4px 0; }
.story .later { font: 12px/1.4 var(--sans); color: var(--faded); }
.also { font: 14px/1.5 var(--sans); color: var(--faded); padding: 10px 0 4px; border-top: 1px solid var(--rule); }
.also b { color: var(--ink); font-weight: 600; }
.also ul { margin: 4px 0 0; padding-left: 18px; }
</style>
</head>
<body>
<div class="wrap">
	<header class="mast">
		<div class="band">
			<div class="sky" id="sky" aria-hidden="true"></div>
			<div class="title"><h1><a href="#/">The Settlement Chronicle</a></h1><div class="date"><span class="live" title="Live: refreshes every few seconds"></span><span id="clock"></span></div></div>
		</div>
		<nav id="nav">
			<a href="#/" data-tab="today">Today</a>
			<a href="#/people" data-tab="people">People</a>
			<a href="#/chronicle" data-tab="chronicle">Chronicle</a>
		</nav>
	</header>
	<main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>

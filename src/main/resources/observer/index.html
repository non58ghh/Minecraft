<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>The Settlement Chronicle</title>
<style>
:root {
	--paper: #f3eee3; --sheet: #fbf8f1; --ink: #201c17; --faded: #776e60; --rule: #d8cfbd; --rule-strong: #b9ad97;
	--accent: #8b2e1a; --good: #4c6a35; --bad: #a33a22;
	--serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
	--sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--paper: #15120e; --sheet: #1c1813; --ink: #ebe3d2; --faded: #a0957f; --rule: #362f26; --rule-strong: #514636;
		--accent: #e08a68; --good: #9cc07a; --bad: #ec8a6f;
		color-scheme: dark;
	}
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 var(--serif); }
a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-color: var(--accent); }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }

/* Masthead */
.mast { border-bottom: 3px double var(--rule-strong); padding: 14px 0 0; }
.mast .title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.mast h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
.mast h1 a { text-decoration: none; }
.mast .date { font: 13px/1.3 var(--sans); color: var(--faded); text-align: right; white-space: nowrap; }
nav { display: flex; gap: 22px; margin-top: 10px; font: 600 14px/1 var(--sans); }
nav a { text-decoration: none; color: var(--faded); padding: 8px 0 10px; border-bottom: 2px solid transparent; }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); }
main { padding: 18px 0 64px; }

/* Type */
h2 { font-size: 15px; font-weight: 600; font-style: italic; color: var(--faded); margin: 34px 0 10px;
	padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
h2:first-child { margin-top: 0; }
.headline { font-size: 27px; line-height: 1.18; font-weight: 700; margin: 6px 0 10px; letter-spacing: -.01em; }
.kicker { font: 600 12px/1.3 var(--sans); color: var(--accent); letter-spacing: .02em; }
.small { font: 13px/1.45 var(--sans); color: var(--faded); }
.quiet { color: var(--faded); }
.bad { color: var(--bad); }
.good { color: var(--good); }
p { margin: 0 0 10px; }
.empty { color: var(--faded); font-style: italic; }
.notice { font: 14px/1.45 var(--sans); border-left: 3px solid var(--accent); padding: 8px 12px; margin: 0 0 16px; background: var(--sheet); }
.more { font: 600 14px/1 var(--sans); color: var(--accent); text-decoration: none; display: inline-block; margin-top: 4px; }
button.more { background: none; border: 0; padding: 8px 0; cursor: pointer; }

/* Dialogue */
.dialogue { margin: 10px 0 6px; padding-left: 14px; border-left: 2px solid var(--rule-strong); }
.dialogue p { margin: 0 0 7px; }
.dialogue .who { font-variant: small-caps; letter-spacing: .03em; font-weight: 600; margin-right: 6px; }

/* Portraits */
.face { display: inline-block; vertical-align: middle; image-rendering: pixelated; border-radius: 2px; flex: none;
	box-shadow: 0 0 0 1px var(--rule-strong); }
.face.dead { filter: grayscale(1); opacity: .6; }

/* Rows of people */
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.people li:last-child { border-bottom: 0; }
.people .name { font-weight: 700; }
.people .doing { font-size: 15px; }
.people a.row { display: flex; gap: 12px; align-items: center; text-decoration: none; flex: 1; min-width: 0; }

/* Chronicle */
.day { font: 700 13px/1 var(--sans); color: var(--accent); margin: 26px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.day:first-child { margin-top: 0; }
.entry { display: grid; grid-template-columns: 46px 1fr; gap: 10px; padding: 7px 0; }
.entry .t { font: 12px/1.9 var(--mono); color: var(--faded); }
.entry .x { min-width: 0; }
.entry.routine { font-size: 15px; color: var(--faded); padding: 3px 0; }
.entry.big .x { font-weight: 700; }
.entry a { text-decoration: none; }
.entry a:hover { text-decoration: underline; }
.times { font: 12px var(--sans); color: var(--faded); margin-left: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font: 600 14px/1 var(--sans); margin-bottom: 18px; }
.filters a { text-decoration: none; color: var(--faded); padding: 6px 0; }
.filters a.on { color: var(--ink); border-bottom: 2px solid var(--accent); }
select { font: 14px var(--sans); color: var(--ink); background: var(--sheet); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 6px 8px; }

/* Person */
.who-head { display: flex; gap: 16px; align-items: center; margin-bottom: 4px; }
.who-head h1 { font-size: 32px; line-height: 1.1; margin: 0; }
.now { font-size: 19px; line-height: 1.45; margin: 14px 0 4px; }
.steps { margin: 6px 0 0; padding-left: 24px; }
.steps li { padding: 3px 0; }
.steps li.next { font-weight: 700; }
.steps li.next::marker { color: var(--accent); }
.condition { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.condition div { font: 13px/1.3 var(--sans); }
.condition b { display: block; font: 600 15px/1.3 var(--serif); }
.meter { height: 3px; background: var(--rule); margin-top: 5px; }
.meter i { display: block; height: 100%; background: var(--ink); }
.meter.low i { background: var(--bad); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
.slot { position: relative; aspect-ratio: 1; background: var(--sheet); border: 1px solid var(--rule-strong);
	border-radius: 3px; padding: 6px; font: 12px/1.2 var(--sans); overflow: hidden; }
.slot .n { position: absolute; right: 6px; bottom: 5px; font: 700 15px/1 var(--mono); }
.slot.tool { border-color: var(--accent); }
.plan-box { border: 1px solid var(--rule-strong); background: var(--sheet); padding: 12px 14px; border-radius: 3px; margin-top: 12px; }
.ledger { list-style: none; margin: 0; padding: 0; }
.ledger li { padding: 7px 0; border-bottom: 1px solid var(--rule); }
.ledger li:last-child { border-bottom: 0; }
.plan { display: inline-grid; gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-top: 6px; }
.plan span { width: 12px; height: 12px; background: var(--sheet); }
.plan span.w { background: var(--ink); }
.plan span.d { background: var(--accent); }
.plan span.o { background: transparent; }
details { margin-top: 10px; }
summary { cursor: pointer; font: 600 14px/1.4 var(--sans); color: var(--accent); list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; }
details[open] summary::before { content: "▾ "; }
table.scores { width: 100%; border-collapse: collapse; font: 13px/1.4 var(--sans); margin-top: 8px; }
table.scores td { padding: 6px 4px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.scores td.v { text-align: right; font-family: var(--mono); white-space: nowrap; }
table.scores tr.chosen td:first-child { font-weight: 700; color: var(--accent); }
.because { margin: 6px 0 0; padding-left: 20px; }
.because li { padding: 2px 0; }
.token { display: flex; gap: 8px; margin-top: 10px; }
.token input { flex: 1; min-width: 0; font: 15px var(--sans); padding: 8px; border: 1px solid var(--rule-strong); border-radius: 4px; background: var(--sheet); color: var(--ink); }
.token button { font: 600 14px var(--sans); padding: 8px 14px; border: 0; border-radius: 4px; background: var(--accent); color: var(--paper); cursor: pointer; }
.hl { background: var(--sheet); outline: 1px solid var(--accent); outline-offset: 2px; }
@media (max-width: 480px) {
	.mast h1 { font-size: 22px; }
	.headline { font-size: 23px; }
	.condition { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<div class="wrap">
	<header class="mast">
		<div class="title"><h1><a href="#/">The Settlement Chronicle</a></h1><div class="date" id="clock"></div></div>
		<nav id="nav">
			<a href="#/" data-tab="today">Today</a>
			<a href="#/people" data-tab="people">People</a>
			<a href="#/chronicle" data-tab="chronicle">Chronicle</a>
		</nav>
	</header>
	<main id="main"></main>
</div>
<script src="app.js"></script>
</body>
</html>

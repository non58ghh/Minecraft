<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Civilization Observer</title>
<style>
:root {
	--bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f1c; --muted: #6b6f68; --line: #e2e0d8;
	--accent: #2f6f4f; --accent-soft: #e3efe8; --warn: #a8442a; --warn-soft: #f6e4dd;
	--bar: #d9d6cc; --food: #c98b2b; --safety: #3f6fa8; --social: #9a4f9a; --belonging: #2f8a7a;
	--radius: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #141614; --panel: #1d201d; --ink: #e9ebe6; --muted: #9aa096; --line: #2e322d;
		--accent: #7cc39b; --accent-soft: #233a2d; --warn: #f0937a; --warn-soft: #3d2620;
		--bar: #343933; --food: #e0aa52; --safety: #7fa7dc; --social: #c98bc9; --belonging: #62c2b0;
		color-scheme: dark;
	}
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
	font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px 6px; max-width: 900px; margin: 0 auto; }
.top h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
.top .clock { color: var(--muted); font-size: 13px; margin-left: auto; white-space: nowrap; }
nav { display: flex; gap: 4px; padding: 0 12px 8px; max-width: 900px; margin: 0 auto; }
nav a { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; color: var(--muted);
	text-decoration: none; font-weight: 600; font-size: 14px; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
main { max-width: 900px; margin: 0 auto; padding: 12px 16px 48px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
.count { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 6px; white-space: nowrap; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 8px 0; border-top: 1px solid var(--line); }
.list li:first-child { border-top: 0; padding-top: 0; }
.meta { color: var(--muted); font-size: 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { display: block; color: inherit; text-decoration: none; background: var(--panel);
	border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.card.dead { opacity: .55; }
.card .row { display: flex; align-items: baseline; gap: 8px; }
.card .name { font-weight: 700; font-size: 16px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
	background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.plain { background: var(--bar); color: var(--ink); }
.needs { display: grid; grid-template-columns: 70px 1fr 34px; gap: 4px 8px; align-items: center; margin: 8px 0 4px; font-size: 12px; }
.needs .track { height: 7px; background: var(--bar); border-radius: 4px; overflow: hidden; }
.needs .fill { height: 100%; border-radius: 4px; }
.needs .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.why .cand { padding: 8px 0; border-top: 1px solid var(--line); }
.why .cand:first-of-type { border-top: 0; }
.why .cand.chosen .label { color: var(--accent); }
.why .head { display: flex; gap: 8px; align-items: baseline; }
.why .label { font-weight: 700; }
.why .score { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.why .scorebar { height: 6px; background: var(--bar); border-radius: 3px; margin: 4px 0 6px; overflow: hidden; }
.why .scorebar div { height: 100%; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
	background: transparent; font-family: inherit; }
a.chip, button.chip { color: var(--accent); border-color: var(--accent); text-decoration: none; cursor: pointer; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
select, button.btn { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line);
	background: var(--panel); color: var(--ink); }
button.btn { cursor: pointer; }
.ev .type { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.ev a { color: inherit; }
.hl { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
.empty { color: var(--muted); font-style: italic; }
.notice { padding: 10px 12px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); margin-bottom: 12px; }
.back { display: inline-block; margin-bottom: 10px; color: var(--accent); text-decoration: none; font-weight: 600; }
.tokenbox { display: flex; gap: 8px; } .tokenbox input { flex: 1; font: inherit; padding: 8px; border-radius: 8px;
	border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 0; }
</style>
</head>
<body>
<header>
	<div class="top"><h1>Civilization Observer</h1><span class="clock" id="clock"></span></div>
	<nav id="nav">
		<a href="#/" data-tab="overview">Overview</a>
		<a href="#/agents" data-tab="agents">Agents</a>
		<a href="#/timeline" data-tab="timeline">Timeline</a>
	</nav>
</header>
<main id="main"></main>
<script src="app.js"></script>
</body>
</html>
